\* Код спеки v2 в окружении, где ledger eve теряет один id (ошибка записи после принятия или
\* вытеснение из последних 200, рецензия спеки v1, п. 1): старт в «Очередь», два переключения
\* (чтобы R1 работал и здесь), остальное как в QueueDrain.cfg. Дубль сообщений доставки, чей id
\* потерян, разрешён (exposed), потеря — нет. Ожидание: ошибок нет.
CONSTANTS
  N = 3
  MaxItems = 2
  MaxRestarts = 1
  MaxLedgerLoss = 1
  MaxSwitches = 2
  Policy = "queue"
  Loop = "any"
  Late = TRUE
  Replies = TRUE
  Pin = TRUE
  SameSender = TRUE
  FreshAck = TRUE
  AloneRule = TRUE
  QueueFirst = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLoss NoDupBeyondBreak QueueOrder WholeBatch AloneStaysAlone BatchAtHead PinAtHead
