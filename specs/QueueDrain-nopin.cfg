\* Свидетель: без закрепа (Pin = FALSE) пачка считается заново после доставки, которую eve приняла
\* после срока Bridge; новая пачка с новым последним id даёт второй ход без перезапуска.
\* Остальное — код спеки v2 (QueueDrain.cfg). Ожидание: NoDupBeyondBreak.
CONSTANTS
  N = 3
  MaxItems = 2
  MaxRestarts = 1
  MaxLedgerLoss = 0
  MaxSwitches = 2
  Policy = "queue"
  Loop = "any"
  Late = TRUE
  Replies = TRUE
  Pin = FALSE
  SameSender = TRUE
  FreshAck = TRUE
  AloneRule = TRUE
  QueueFirst = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLoss NoDupBeyondBreak QueueOrder WholeBatch AloneStaysAlone BatchAtHead PinAtHead
