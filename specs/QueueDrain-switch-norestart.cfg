\* Свидетель F1 без перезапуска: код спеки v2 без R1. Прямая доставка принята после срока Bridge и
\* снова встаёт в очередь за сообщением того же автора, пока inFlight держит чат после чужой
\* пачки. Ожидание: NoLoss.
CONSTANTS
  N = 3
  MaxItems = 2
  MaxRestarts = 0
  MaxLedgerLoss = 0
  MaxSwitches = 2
  Policy = "steer"
  Loop = "seq"
  Late = TRUE
  Replies = TRUE
  Pin = TRUE
  SameSender = TRUE
  FreshAck = TRUE
  AloneRule = TRUE
  QueueFirst = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoLoss NoDupBeyondBreak QueueOrder WholeBatch AloneStaysAlone BatchAtHead PinAtHead
