\* Код спеки v2 (все переключатели кода TRUE, R1 в маршруте): старт в «Очередь», владелец дважды
\* переключает режим, маршрут между любыми шагами слива (Loop = "any", шире кода), ответы боту
\* мимо очереди, доставка может быть принята после срока Bridge, один перезапуск, ledger не
\* теряет id. 3 сообщения, граница пачки 2. Ожидание: ошибок нет.
CONSTANTS
  N = 3
  MaxItems = 2
  MaxRestarts = 1
  MaxLedgerLoss = 0
  MaxSwitches = 2
  Policy = "queue"
  Loop = "any"
  Late = TRUE
  Replies = TRUE
  Pin = TRUE
  SameSender = TRUE
  FreshAck = TRUE
  AloneRule = TRUE
  QueueFirst = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLoss NoDupBeyondBreak QueueOrder WholeBatch AloneStaysAlone BatchAtHead PinAtHead
