\* Свидетель: склейка без правила одного автора (SameSender = FALSE). Прямая доставка X принята
\* после срока Bridge, X снова встаёт в очередь за чужим Y; пачка Y+X с id X получает handled, Y
\* пропадает. Остальное — код спеки v2 (QueueDrain.cfg). WholeBatch не проверяется: правило автора
\* записано в нём самом. Ожидание: NoLoss.
CONSTANTS
  N = 3
  MaxItems = 2
  MaxRestarts = 1
  MaxLedgerLoss = 0
  MaxSwitches = 2
  Policy = "queue"
  Loop = "any"
  Late = TRUE
  Replies = TRUE
  Pin = TRUE
  SameSender = FALSE
  FreshAck = TRUE
  AloneRule = TRUE
  QueueFirst = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLoss NoDupBeyondBreak QueueOrder AloneStaysAlone BatchAtHead PinAtHead
