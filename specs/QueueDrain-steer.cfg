\* Код спеки v2, старт в «Перебивать» (так стоит c1): владелец дважды переключает режим,
\* остальное как в QueueDrain.cfg. Здесь R1 работает: очередь копится за переключением и за
\* сливом в полёте, а прямая доставка её не обгоняет. Ожидание: ошибок нет.
CONSTANTS
  N = 3
  MaxItems = 2
  MaxRestarts = 1
  MaxLedgerLoss = 0
  MaxSwitches = 2
  Policy = "steer"
  Loop = "any"
  Late = TRUE
  Replies = TRUE
  Pin = TRUE
  SameSender = TRUE
  FreshAck = TRUE
  AloneRule = TRUE
  QueueFirst = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLoss NoDupBeyondBreak QueueOrder WholeBatch AloneStaysAlone BatchAtHead PinAtHead
